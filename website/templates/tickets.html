<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support – NextGen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
</head>
<body class="theme-dark">

<header class="site-header">
    <nav class="navbar">
        <div class="brand">NextGen</div>
        <ul class="nav-links">
            <li id="homeLink"><a href="{{ url_for('index') }}">Home</a></li>
            <li id="aboutLink"><a href="{{ url_for('about') }}">About</a></li>

            <li id="dashboardLink" style="display:none;">
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
            </li>

            <li id="accountLink" style="display:none;">
                <a href="{{ url_for('invoices') }}">My Account</a>
            </li>

            <li id="contactLink" style="display:none;">
                <a href="{{ url_for('tickets') }}">Contact Us</a>
            </li>

            <li id="loginBtn">
                <a href="{{ url_for('login') }}" class="nav-cta">Login</a>
            </li>

            <li id="userDisplay" style="display:none;"></li>

            <li id="logoutBtn" style="display:none;">
                <a href="#" onclick="logout()">Logout</a>
            </li>
        </ul>

        <button id="themeToggle" class="theme-toggle">🌙</button>
    </nav>
</header>

<!-- MAIN CONTENT -->
<section class="section fade-up">
    <h1 class="section-title">Contact Support</h1>

    <p style="text-align:center; max-width:720px; margin:0 auto 40px; color:#bdbdbd;">
        Use the form below to contact our team. Requests are automatically routed to the
        appropriate department.
    </p>

    <!-- FORM CARD -->
    <div class="search-section fade-up" style="max-width:800px; margin:0 auto;">
        <div class="search-container" style="flex-direction:column; gap:16px;">
            <form onsubmit="sendMessage(event)" style="width:100%; display:flex; flex-direction:column; gap:16px;">

                <div style="display:flex; gap:16px;">
                    <select id="category" class="search-input" required>
                        <option value="book">Book Event</option>
                        <option value="event">Report Event Issue</option>
                        <option value="tech">Report Technical Issue</option>
                    </select>

                    <input id="title"
                           class="search-input"
                           placeholder="Title"
                           required>
                </div>

                <textarea id="message"
                          class="search-input"
                          rows="5"
                          placeholder="Describe your request"
                          required></textarea>

                <div style="text-align:right;">
                    <button type="submit" class="btn-primary">
                        Send Message
                    </button>
                </div>

            </form>
        </div>
    </div>
</section>

<footer class="footer">
    <p>© 2025 NextGen Event Management</p>
</footer>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
