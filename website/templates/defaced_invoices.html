<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account – NextGen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
</head>
<body class="theme-dark">

<header class="site-header">
    <nav class="navbar">
        <div class="brand">NextGen</div>
        <ul class="nav-links">
            <li id="homeLink"><a href="{{ url_for('index') }}">Home</a></li>
            <li id="aboutLink"><a href="{{ url_for('about') }}">About</a></li>

            <li id="dashboardLink" style="display:none;">
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
            </li>

            <li id="accountLink" style="display:none;">
                <a href="{{ url_for('invoices') }}">My Account</a>
            </li>

            <li id="contactLink" style="display:none;">
                <a href="{{ url_for('tickets') }}">Contact Us</a>
            </li>

            <li id="loginBtn">
                <a href="{{ url_for('login') }}" class="nav-cta">Login</a>
            </li>

            <li id="userDisplay" style="display:none;"></li>

            <li id="logoutBtn" style="display:none;">
                <a href="#" onclick="logout()">Logout</a>
            </li>
        </ul>

        <button id="themeToggle" class="theme-toggle">🌙</button>
    </nav>
</header>

<section class="section dashboard fade-in">
    <h1>My Account</h1>

    <div class="chart-card fade-up">
        <h2>Payment Information</h2>
        <p><strong>IBAN:</strong> <span id="IBAN">AT42 4242 1212 1919 1337</span></p>
    </div>

    <div class="chart-card fade-up">
        <h2>Payments</h2>
        <table class="payment-table">
            <thead>
            <tr>
                <th>Invoice</th>
                <th>Date</th>
                <th>Amount</th>
            </tr>
            </thead>
            <tbody id="paymentsTable"></tbody>
        </table>
    </div>
</section>

<footer class="footer">
    <p>© 2025 NextGen Event Management</p>
</footer>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
