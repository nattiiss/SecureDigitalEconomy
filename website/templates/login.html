<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – NextGen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body class="theme-dark">

<header class="site-header">
    <nav class="navbar">
        <div class="brand">NextGen</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
            <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
            <li id="loginBtn"><a href="{{ url_for('login') }}" class="nav-cta">Login</a></li>
            <li id="userDisplay" style="display: none;"></li>
            <li id="logoutBtn" style="display: none;"><a href="#" onclick="logout()">Logout</a></li>

        </ul>
        <button id="themeToggle" class="theme-toggle">🌙</button>
    </nav>
</header>

<script>
    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const res = await fetch("/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.status !== 200) {
            alert("Invalid credentials");
            return;
        }

        // Store role so dashboard can filter charts
        localStorage.setItem("username", data.user.username);
        localStorage.setItem("role", data.user.role);

        // Go to dashboard
        window.location.href = "/dashboard/";
    }
</script>

<div class="login-container fade-in">
    <div class="login-box">
        <h2>Login</h2>

        <form onsubmit="event.preventDefault(); login();">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn-primary">Login</button>
        </form>
    </div>
</div>

<footer class="footer">
    <p>© 2025 NextGen Event Management</p>
</footer>

<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
